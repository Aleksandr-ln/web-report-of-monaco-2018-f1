<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drivers List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 35%;
            max-width: 500px;
            font-family: Arial, sans-serif;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 6px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        th:nth-child(1), th:nth-child(2) {
            text-align: center;
        }
        a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }
        a:hover {
            color: red;
        }
        td:nth-child(1) { 
            width: 100px;
        }
        td:nth-child(2) { 
            width: 70px;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Drivers List</h1>

    <p>
        <a href="{{ url_for('report_drivers', order='asc') }}">Sort Ascending</a> | 
        <a href="{{ url_for('report_drivers', order='desc') }}">Sort Descending</a>
    </p>

    <table>
        <tr>
            <th>Driver</th>
            <th>Wikipedia Code</th>
        </tr>
        {% for abbr, driver in drivers %}
        <tr>
            <td>{{ driver.name }}</td>
            <td>
                <a href="https://en.wikipedia.org/wiki/{{ special_wikipedia_names.get(driver.name, driver.name.replace(' ', '_')) }}" target="_blank">
                    {{ driver.name.split()[-1][:3].upper() }}
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
